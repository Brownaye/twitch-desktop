<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src wss://irc-ws.chat.twitch.tv" />
  <title>Chat</title>
  <link rel="stylesheet" href="livechat.css" />
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <svg class="h-ico" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="h-name" id="h-name">Chat</span>
      <span class="h-state" id="h-state"></span>
      <span class="h-rate" id="h-rate"></span>
      <button class="wgo" id="b-wgo" title="Summarise what chat has been saying"><span class="wgo-ring"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><circle class="fg" id="wgo-fg" cx="10" cy="10" r="7.5"/></svg><svg class="wgo-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span><span id="wgo-label">What's going on?</span></button>
      <button class="hb" id="b-ext" title="Open chat on twitch.tv"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
      <button class="hb close" id="b-close" title="Hide chat (the chat button on the player brings it back)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>

    <section class="recap" id="recap" hidden>
      <div class="recap-head">
        <svg class="spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        <span class="recap-label">What's been going on</span>
        <span class="recap-when" id="recap-when"></span>
        <button class="rb" id="b-again" title="Ask again"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      </div>
      <div class="recap-text" id="recap-text"></div>
      <button class="recap-more" id="recap-more" hidden></button>
      <ol class="recap-history" id="recap-history" hidden></ol>
    </section>

    <main class="msgs" id="msgs"></main>
    <button class="below" id="below" hidden>More messages below</button>
    <form class="compose" id="compose" hidden autocomplete="off"><input id="say" maxlength="500" placeholder="Send a message" /><button type="submit" class="send">Chat</button></form>
    <div class="compose-off" id="compose-off">Read-only. Sign in to Twitch (Settings in the main window) to type here.</div>
  </div>
  <script src="livechat.js"></script>
</body>
</html>
