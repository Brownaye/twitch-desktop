<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src wss://eventsub.wss.twitch.tv" />
  <title>Twitch</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <span class="av" id="h-av"></span>
      <div class="h-text">
        <div class="h-line"><span class="h-name" id="h-name"></span><span class="badge" id="h-badge"></span><span class="h-meta" id="h-meta"></span></div>
        <div class="h-title" id="h-title"></div>
      </div>
      <button class="pill" id="b-start" title="Watch this stream from the beginning" hidden><svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg><span>From start</span></button>
      <div class="menu-wrap">
        <button class="hb" id="b-sleep" title="Sleep timer"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="sleep-left" id="sleep-left"></span></button>
        <div class="sizes menu" id="sleep-menu" hidden>
          <div class="sizes-title">Sleep timer</div>
          <button data-sleep="15"><span class="nm">15 minutes</span></button>
          <button data-sleep="30"><span class="nm">30 minutes</span></button>
          <button data-sleep="45"><span class="nm">45 minutes</span></button>
          <button data-sleep="60"><span class="nm">1 hour</span></button>
          <button data-sleep="90"><span class="nm">1 hour 30</span></button>
          <button data-sleep="end" id="sleep-end"><span class="nm">End of this video</span></button>
          <button data-sleep="off" id="sleep-off"><span class="nm">Off</span></button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="hb" id="b-chapters" title="Chapters: jump to a game" hidden><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
        <div class="sizes menu chapters" id="chapters-menu" hidden></div>
      </div>
      <button class="hb" id="b-audio" title="Audio mode: lowest quality, picture hidden"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></button>
      <button class="hb" id="b-grid" title="Multi-view: up to 4 streams at once, sound on the one you click (G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
      <button class="pill" id="b-chat" title="Show or hide live chat" hidden><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span id="b-chat-label">Chat</span></button>
      <div class="sizes-wrap">
        <button class="hb" id="b-size" title="Player size"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="3" y="11" width="10" height="10" rx="1.5"/></svg></button>
        <div class="sizes" id="sizes" hidden>
          <div class="sizes-title">Player size</div>
          <button data-size="small"><span class="pv"><i style="width:34%"></i></span><span class="nm">Small</span><span class="kb">1</span></button>
          <button data-size="medium"><span class="pv"><i style="width:52%"></i></span><span class="nm">Medium</span><span class="kb">2</span></button>
          <button data-size="large"><span class="pv"><i style="width:72%"></i></span><span class="nm">Large</span><span class="kb">3</span></button>
          <button data-size="max"><span class="pv"><i style="width:100%"></i></span><span class="nm">Fill beside the app</span><span class="kb">4</span></button>
        </div>
      </div>
      <button class="hb" id="b-detach" title="Detach from the app (D)"><svg class="i-detach" viewBox="0 0 24 24"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg><svg class="i-dock" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="10" y1="4" x2="10" y2="20"/><polyline points="17 9 14 12 17 15"/></svg></button>
      <button class="hb" id="b-pip" title="Picture in picture (P)"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg></button>
      <button class="hb" id="b-ext" title="Open on twitch.tv"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
      <button class="hb" id="b-full" title="Fullscreen (F11)"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
      <button class="hb" id="b-min" title="Minimise"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="hb close" id="b-close" title="Close player"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>
    <main class="stage" id="stage">
      <div class="card" id="card">
        <div class="card-bg" id="card-bg"></div>
        <div class="card-body">
          <span class="av big" id="c-av"></span>
          <div class="c-name" id="c-name"></div>
          <div class="c-title" id="c-title"></div>
          <div class="c-meta"><span class="badge" id="c-badge"></span><span id="c-meta"></span></div>
          <div class="loader"><span></span></div>
        </div>
      </div>
      <div class="snap" id="snap"></div>
      <div class="audio-card" id="audio-card" hidden>
        <div class="audio-bg" id="audio-bg"></div>
        <div class="audio-body"><span class="av big" id="a-av"></span><div class="a-name" id="a-name"></div><div class="a-bars"><i></i><i></i><i></i><i></i><i></i></div><div class="a-note">Audio mode: lowest quality, picture hidden. Click here or the headphones to bring it back.</div></div>
      </div>
      <div class="raid" id="raid" hidden>
        <div class="raid-text"><strong id="raid-from"></strong> is raiding <strong id="raid-to"></strong></div>
        <div class="raid-bar"><span id="raid-fill"></span></div>
        <div class="raid-acts"><button class="raid-go" id="raid-go">Go now</button><button class="raid-stay" id="raid-stay">Stay</button></div>
      </div>
      <div class="sleep-fade" id="sleep-fade" hidden><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Sleep timer: fading out</span></div>
      <div class="ptoast" id="ptoast" hidden></div>
      <button class="edge" id="b-edge" title="Hide the app"><svg viewBox="0 0 24 24"><polyline id="edge-arrow" points="9 6 15 12 9 18"/></svg></button>
    </main>
  </div>
  <script src="player.js"></script>
</body>
</html>
